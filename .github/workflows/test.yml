name: GuardAI Sentinel validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal API test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic benchmark
        run: python -m sentinel.evaluate --output evaluation-results.json
      - name: Static CLI smoke test
        run: python -m sentinel.cli examples/vulnerable_login.py
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: evaluation-results.json
